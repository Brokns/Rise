<!-- RISE — Hub de notícias da comunidade -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0B0E14;
    --surface: #131822;
    --surface-2: #1B222E;
    --border: #262E3D;
    --text: #E8EAF0;
    --text-muted: #8B93A7;
    --orange: #FF6B35;
    --amber: #FFB627;
    --teal: #4ECDC4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #rise-root {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  #rise-root .mono { font-family: 'JetBrains Mono', monospace; }
  #rise-root .display { font-family: 'Archivo Black', sans-serif; }

  /* ---------- Rise Line (signature element) ---------- */
  #rise-root .rise-line {
    height: 3px;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--orange) 35%, var(--amber) 65%, transparent);
    background-size: 200% 100%;
    animation: rise-drift 6s ease-in-out infinite;
  }
  @keyframes rise-drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    #rise-root .rise-line { animation: none; }
  }

  #rise-root .logo { cursor: pointer; user-select: none; }
  #rise-root .logo:hover { opacity: 0.85; }

  /* ---------- Social sidebar ---------- */
  #rise-root .social-sidebar {
    position: fixed;
    top: 90px;
    left: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 40;
    opacity: 0;
    transform: translateX(-20px);
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  #rise-root .social-sidebar.open {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  #rise-root .social-sidebar a {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: border-color .15s, color .15s, transform .15s;
  }
  #rise-root .social-sidebar a:hover {
    transform: translateX(3px);
  }
  #rise-root .social-sidebar a.discord:hover { border-color: #5865F2; color: #5865F2; }
  #rise-root .social-sidebar a.instagram:hover { border-color: var(--orange); color: var(--orange); }
  #rise-root .social-sidebar a svg { width: 22px; height: 22px; }
  #rise-root .social-sidebar a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #rise-root header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  #rise-root .logo {
    font-size: 22px;
    letter-spacing: 1px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  #rise-root .logo span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
  }
  #rise-root nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  #rise-root nav button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  #rise-root nav button:hover { color: var(--text); background: var(--surface-2); }
  #rise-root nav button.active { color: var(--bg); background: var(--orange); }
  #rise-root nav button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  #rise-root .publish-btn {
    background: linear-gradient(90deg, var(--orange), var(--amber));
    color: #0B0E14;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  #rise-root .publish-btn:hover { filter: brightness(1.08); }
  #rise-root .publish-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------- Hero ---------- */
  #rise-root .hero {
    position: relative;
    padding: 72px 32px 48px;
    text-align: center;
    overflow: hidden;
  }
  #rise-root .hero::before {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 140%;
    height: 220px;
    background: radial-gradient(ellipse at center, rgba(255,107,53,0.18), transparent 70%);
    pointer-events: none;
  }
  #rise-root .hero h1 {
    font-size: clamp(32px, 5vw, 56px);
    line-height: 1.05;
    position: relative;
    z-index: 1;
  }
  #rise-root .hero h1 .grad {
    background: linear-gradient(90deg, var(--orange), var(--amber));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #rise-root .hero p {
    margin-top: 16px;
    color: var(--text-muted);
    font-size: 16px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Filters ---------- */
  #rise-root .filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 24px 32px 8px;
    flex-wrap: wrap;
  }
  #rise-root .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all .15s;
  }
  #rise-root .pill:hover { border-color: var(--orange); color: var(--text); }
  #rise-root .pill.active { background: var(--orange); border-color: var(--orange); color: #0B0E14; font-weight: 600; }
  #rise-root .pill:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------- Grid ---------- */
  #rise-root .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }
  #rise-root .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    transition: border-color .15s, transform .15s;
  }
  #rise-root .card:hover { border-color: var(--orange); transform: translateY(-2px); }
  #rise-root .card .tag {
    align-self: flex-start;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 4px;
    font-weight: 500;
  }
  #rise-root .tag.esports { background: rgba(255,107,53,0.15); color: var(--orange); }
  #rise-root .tag.servidor { background: rgba(78,205,196,0.15); color: var(--teal); }
  #rise-root .tag.novidades { background: rgba(255,182,39,0.15); color: var(--amber); }

  #rise-root .card h3 { font-size: 18px; line-height: 1.3; }
  #rise-root .card p { color: var(--text-muted); font-size: 14px; flex: 1; }
  #rise-root .card .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 4px;
  }
  #rise-root .card .del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }
  #rise-root .card .del:hover { color: var(--orange); }

  #rise-root .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  /* ---------- Modal ---------- */
  #rise-root .overlay {
    position: fixed; inset: 0;
    background: rgba(11,14,20,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #rise-root .overlay.open { display: flex; }
  #rise-root .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
  }
  #rise-root .modal h2 { font-size: 20px; margin-bottom: 18px; }
  #rise-root .field { margin-bottom: 14px; }
  #rise-root .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  #rise-root .field input,
  #rise-root .field textarea,
  #rise-root .field select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  #rise-root .field textarea { resize: vertical; min-height: 80px; }
  #rise-root .field input:focus,
  #rise-root .field textarea:focus,
  #rise-root .field select:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
  #rise-root .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  #rise-root .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #rise-root .btn-cancel:hover { color: var(--text); }

  #rise-root footer {
    text-align: center;
    padding: 32px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    border-top: 1px solid var(--border);
  }

  #rise-root .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-2);
    border: 1px solid var(--orange);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
    z-index: 60;
  }
  #rise-root .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div id="rise-root">
  <header>
    <div class="logo display">RISE</div>
    <nav id="nav"></nav>
    <button class="publish-btn" id="openModal">+ Publicar</button>
  </header>

  <div class="rise-line"></div>

  <div class="social-sidebar" id="socialSidebar">
    <a class="discord" href="https://discord.gg/TFzXzxaZya" target="_blank" rel="noopener noreferrer" aria-label="Entrar no Discord da Rise">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.099.245.197.372.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.662a.06.06 0 0 0-.031-.028ZM8.02 15.331c-1.182 0-2.156-1.085-2.156-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.175 1.096 2.156 2.419 0 1.334-.955 2.419-2.156 2.419Zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.174 1.096 2.156 2.419 0 1.334-.946 2.419-2.156 2.419Z"/></svg>
    </a>
    <a class="instagram" href="https://instagram.com/rise_gg17" target="_blank" rel="noopener noreferrer" aria-label="Seguir a Rise no Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>
    </a>
  </div>

  <div class="hero">
    <h1 class="display">AS NOTÍCIAS QUE <span class="grad">FAZEM NOSSA COMUNIDADE NASCER</span></h1>
    <p>Esports, bastidores do servidor e as novidades da Rise, tudo em um só lugar.</p>
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="grid"></div>

  <footer>RISE — feito pela comunidade, para a comunidade.</footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 class="display">Nova publicação</h2>
      <div class="field">
        <label>CATEGORIA</label>
        <select id="f-cat">
          <option value="esports">Esports</option>
          <option value="servidor">Servidor</option>
          <option value="novidades">Novidades</option>
        </select>
      </div>
      <div class="field">
        <label>TÍTULO</label>
        <input id="f-title" type="text" maxlength="90" placeholder="Ex: Rise Cup 3v3 abre inscrições" />
      </div>
      <div class="field">
        <label>TEXTO</label>
        <textarea id="f-body" maxlength="600" placeholder="Escreva a notícia..."></textarea>
      </div>
      <div class="field">
        <label>AUTOR</label>
        <input id="f-author" type="text" maxlength="30" placeholder="Seu nome ou nick" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelModal">Cancelar</button>
        <button class="publish-btn" id="submitPost">Publicar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function() {
  const CATS = [
    { id: 'todos', label: 'Todos' },
    { id: 'esports', label: 'Esports' },
    { id: 'servidor', label: 'Servidor' },
    { id: 'novidades', label: 'Novidades' },
  ];
  const TAG_LABEL = { esports: 'Esports', servidor: 'Servidor', novidades: 'Novidades' };

  let posts = [];
  let activeFilter = 'todos';

  const $ = (sel) => document.querySelector(sel);
  const grid = $('#grid');
  const nav = $('#nav');
  const filtersEl = $('#filters');
  const overlay = $('#overlay');
  const toastEl = $('#toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
  }

  function seedPosts() {
    const now = Date.now();
    return [
      {
        id: 'seed-1',
        cat: 'servidor',
        title: 'Rise Cup 3v3 — inscrições abertas',
        body: 'Ainda dá tempo de montar seu trio e entrar na Rise Cup! Sem trio? Comenta no servidor que a gente ajuda a formar sua equipe.',
        author: 'Equipe Rise',
        date: new Date(now - 86400000).toISOString(),
      },
      {
        id: 'seed-2',
        cat: 'esports',
        title: 'Bem-vindo ao hub de notícias da Rise',
        body: 'A partir de agora, tudo que rola no cenário de esports e na nossa comunidade passa por aqui. Fique de olho.',
        author: 'Equipe Rise',
        date: new Date(now - 3 * 86400000).toISOString(),
      },
    ];
  }

  function readHash() {
    const hash = window.location.hash.replace('#', '');
    if (CATS.some(c => c.id === hash)) activeFilter = hash;
  }

  async function loadPosts() {
    try {
      const res = await window.storage.get('news:posts', true);
      posts = res && res.value ? JSON.parse(res.value) : [];
      if (!posts.length) {
        posts = seedPosts();
        await savePosts();
      }
    } catch (e) {
      posts = seedPosts();
      try { await savePosts(); } catch (e2) { /* storage unavailable */ }
    }
    readHash();
    render();
  }

  async function savePosts() {
    try {
      await window.storage.set('news:posts', JSON.stringify(posts), true);
    } catch (e) {
      console.error('Falha ao salvar', e);
      showToast('Não foi possível salvar. Tente novamente.');
    }
  }

  function goToCategory(id) {
    activeFilter = id;
    window.location.hash = id === 'todos' ? '' : id;
    render();
    grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderNav() {
    nav.innerHTML = '';
    CATS.forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c.label;
      if (c.id === activeFilter) btn.classList.add('active');
      btn.addEventListener('click', () => goToCategory(c.id));
      nav.appendChild(btn);
    });
  }

  function renderFilters() {
    filtersEl.innerHTML = '';
    CATS.forEach(c => {
      const p = document.createElement('button');
      p.className = 'pill mono' + (c.id === activeFilter ? ' active' : '');
      p.textContent = c.id === 'todos' ? c.label.toUpperCase() : '#' + c.label.toUpperCase();
      p.addEventListener('click', () => goToCategory(c.id));
      filtersEl.appendChild(p);
    });
  }

  function renderGrid() {
    grid.innerHTML = '';
    const list = posts
      .filter(p => activeFilter === 'todos' || p.cat === activeFilter)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.style.gridColumn = '1 / -1';
      empty.textContent = 'Nenhuma publicação aqui ainda. Seja o primeiro a postar.';
      grid.appendChild(empty);
      return;
    }

    list.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="tag ${p.cat}">${TAG_LABEL[p.cat] || p.cat}</span>
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.body)}</p>
        <div class="meta">
          <span>${escapeHtml(p.author || 'Anônimo')} · ${fmtDate(p.date)}</span>
          <button class="del" data-id="${p.id}">excluir</button>
        </div>
      `;
      grid.appendChild(card);
    });

    grid.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        posts = posts.filter(p => p.id !== btn.dataset.id);
        await savePosts();
        render();
        showToast('Publicação removida.');
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    renderNav();
    renderFilters();
    renderGrid();
  }

  $('#openModal').addEventListener('click', () => overlay.classList.add('open'));
  $('.logo').addEventListener('click', () => {
    $('#socialSidebar').classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    const sidebar = $('#socialSidebar');
    const logo = $('.logo');
    if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !logo.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  });
  $('#cancelModal').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

  $('#submitPost').addEventListener('click', async () => {
    const cat = $('#f-cat').value;
    const title = $('#f-title').value.trim();
    const body = $('#f-body').value.trim();
    const author = $('#f-author').value.trim();

    if (!title || !body) {
      showToast('Preencha título e texto.');
      return;
    }

    posts.push({
      id: 'p-' + Date.now(),
      cat, title, body,
      author: author || 'Anônimo',
      date: new Date().toISOString(),
    });

    await savePosts();
    $('#f-title').value = '';
    $('#f-body').value = '';
    $('#f-author').value = '';
    overlay.classList.remove('open');
    activeFilter = 'todos';
    render();
    showToast('Publicado!');
  });

  loadPosts();
})();
</script>
